name: build-libcurl-static

on: workflow_dispatch

jobs:
  build-windows:
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include: [
          { runner: windows-latest, msystem: CLANG64, arch: x86_64, flavor: w64-clang, cc: clang },
          { runner: windows-latest, msystem: UCRT64, arch: x86_64, flavor: w64-ucrt, cc: gcc },
          { runner: windows-latest, msystem: MINGW64, arch: x86_64, flavor: w64, cc: gcc },
          { runner: windows-latest, msystem: MINGW32, arch: i686, flavor: w64, cc: gcc },
          { runner: windows-11-arm, msystem: CLANGARM64, arch: aarch64, flavor: w64-clang, cc: clang }
        ]
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        release: false
        update: false
        suppress-deprecation-warnings: msystem-mingw32 msystem-mingw64
        install: >-
          base-devel
          git
          mingw-${{ matrix.flavor }}-${{ matrix.arch }}-${{ matrix.cc }}
          make
          libtool
          autoconf
          automake-wrapper
          liblzma
          mingw-${{ matrix.flavor }}-${{ matrix.arch }}-openssl
    - name: prepare environment
      run: |
          dest=`echo ${{ matrix.msystem }} |tr [:upper:] [:lower:]`
          echo "dest=$dest" >> $GITHUB_ENV
          echo "target_triplet=`${{ matrix.cc }} -dumpmachine`" >> $GITHUB_ENV
    - name: fetch curl source
      run: |
          curl -Ls -o curl-8.23.0.tar.bz2 https://github.com/curl/curl/releases/download/curl-8_23_0/curl-8.23.0.tar.bz2
          tar xjf curl-8.23.0.tar.bz2
    - name: configure curl
      run: |
          cd curl-8.23.0
          ./configure --disable-ldap --disable-ldaps --disable-rtsp --disable-dict --disable-telnet --disable-tftp --disable-pop3 --disable-imap --disable-smb --disable-smtp --disable-gopher --disable-mqtt --disable-manual --disable-threaded-resolver --disable-pthreads --disable-sspi --disable-aws --disable-ntlm --disable-ntlm-wb --disable-tls-srp --disable-unix-sockets --disable-doh --disable-dnsshuffle --disable-alt-svc --disable-hsts --disable-websockets --with-openssl --without-brotli --without-libidn2 --without-ngtcp2 --without-quiche --without-msh3 --without-nghttp2 --without-libpsl
    - name: build libcurl
      run: |
          CURDIR=`pwd`
          cd curl-8.23.0/lib
          make
          cp .libs/libcurl.a .
          cd ..
          tar cf $CURDIR/libcurl-static.tar lib/libcurl.a include/curl/*.h
    - name: publish artifact
      uses: actions/upload-artifact@v6
      with:
        name: libcurl_${{ matrix.arch }}-windows-${{ env.dest }}
        path: libcurl-static.tar
